name: Xcode 27.2
description: >-
  Xcode 27.2 with its Metal toolchain on GitHub's xcode-27 image, as
  gpui-fast builds against the 27.2 SDKs and compiles its Metal shaders at
  build time. Run actions/checkout first.

runs:
  using: composite
  steps:
    # The image defaults to Xcode 27.1. The other Xcodes go, for room: the
    # image guarantees only 14 GB free, and a workspace build fills most of it.
    - name: Xcode 27.2
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_27.2.app
        echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
        for x in /Applications/Xcode_27.app /Applications/Xcode_27.1.app; do
          if [[ -d "$x" ]]; then sudo rm -rf "$x" & fi
        done
        wait
        xcodebuild -version
        df -h /
    # The Metal toolchain is a separate component of Xcode.
    - name: Metal toolchain
      shell: bash
      run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
