name: CI
on:
  pull_request:
  # The fork starts a run by hand too, for a head its push did not run.
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

env:
  # Debug info is most of a build's disk footprint and a large share of its
  # link time, and nothing in CI reads it. Dropping it keeps every job's
  # dependency cache small enough to stay under the repository's 10 GB cache
  # limit instead of being evicted before the next run can use it.
  CARGO_PROFILE_DEV_DEBUG: 0

# The fork builds for Apple targets only (macOS on Apple silicon and iOS, 27.2
# and up), so every job that compiles runs on macOS. Every job that compiles
# Rust relies on the dependency cache that
# `actions-rust-lang/setup-rust-toolchain` installs (Swatinem/rust-cache).
# Only `main` saves caches; pull requests restore the closest `main` cache
# through rust-cache's prefix fallback. Keep each job on one feature set: a
# second `cargo` invocation with different features recompiles GPUI.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typo check
        uses: crate-ci/typos@v1.40.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.1
      - name: Machete
        run: cargo machete

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lints every member and, as a side effect, type-checks the example
      # crates that the `test` job leaves out.
      - name: Lint
        run: cargo clippy --workspace --locked -- --deny warnings

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-ios,aarch64-apple-ios-sim
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-shared-key: ios
      - name: Check the library crates for iOS
        run: >-
          cargo check --locked --target aarch64-apple-ios --target aarch64-apple-ios-sim
          -p gpui-kit -p gpui-base -p gpui-component -p gpui-kit-assets -p gpui-fps

  no-default-features:
    name: No default features
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check without default features (tree-sitter disabled)
        run: cargo check -p gpui-component --no-default-features --locked
      # Control callback, legacy alias, and Form contract tests on the same
      # feature set, so they reuse the build above.
      - name: Test without default features
        run: |
          cargo test --locked -p gpui-component --no-default-features --test integration -- \
            controlled_change_callbacks:: legacy_controls_compat::
          cargo test --locked -p gpui-component --no-default-features --lib form::form::tests

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compiling and linking a test binary for every `examples/` crate was
      # most of the warm-cache build time; the `lint` job type-checks them
      # instead. Leaving them out changes no crate's feature set.
      - name: Leave the example crates to the lint job
        run: |
          excludes=$(cargo metadata --no-deps --format-version 1 | jq -j '
            (.workspace_root + "/examples/") as $examples
            | .packages[]
            | select(.manifest_path | startswith($examples))
            | "--exclude \(.name) "')
          echo "TEST_EXCLUDES=$excludes" >> "$GITHUB_ENV"
      # `gpui-component-story/test-support` turns on `gpui-kit/test-support`, so
      # this single run also covers the headless UI integration tests in
      # `crates/kit/tests`.
      - name: Test
        run: >-
          cargo test --workspace
          --features gpui-component-story/test-support --locked
          $TEST_EXCLUDES
      - name: Doc tests
        run: >-
          cargo test --workspace
          --features gpui-component-story/test-support --locked
          $TEST_EXCLUDES --doc
      # `crates/kit/tests/rendering.rs` needs Metal and is opted out of the
      # default test set; select it with the same feature set so it reuses the
      # build above.
      - name: UI rendering tests
        run: >-
          cargo test --workspace
          --features gpui-component-story/test-support --locked
          $TEST_EXCLUDES --test rendering
