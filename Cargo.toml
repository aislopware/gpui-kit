[workspace]
default-members = ["crates/story"]
members = [
    "crates/kit",
    "crates/base",
    "crates/base/examples/native",
    "crates/component-macros",
    "crates/story",
    "crates/component",
    "crates/assets",
    "crates/fps",
    "examples/app_assets",
    "examples/fps_monitor",
    "examples/hello_world",
    "examples/input",
    "examples/editor",
    "examples/syntect",
    "examples/tig",
    "examples/brush",
    "examples/dock",
    "examples/html",
    "examples/large-text",
    "examples/markdown",
    "examples/stream-markdown",
    "examples/window_title",
    "examples/dialog_overlay",
    "examples/system_monitor",
    "examples/focus_trap",
    "examples/tooltip_top_edge",
    "examples/sidebar",
    "examples/text_max_lines",
    "examples/text_selection",
    "examples/touch_selection",
    "examples/table_in_scrollable",
    "examples/markdown_table",
    "examples/speech",
]
resolver = "3"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
gpui-kit = { path = "crates/kit", version = "0.9.0" }
gpui-component = { path = "crates/component", version = "0.9.0" }
gpui-base = { path = "crates/base", version = "0.9.0" }
gpui-component-macros = { path = "crates/component-macros", version = "0.9.0" }
gpui-kit-assets = { path = "crates/assets", version = "0.9.0" }
gpui-fps = { path = "crates/fps", version = "0.9.0" }

# GPUI is aislopware/gpui-fast, from git at the rev onicode pins (its root
# Cargo.toml), so an application on this kit and onicode itself resolve one
# GPUI: the same packages from the same source, no `[patch]` and no crates.io
# stand-ins. Only Apple targets are built (macOS on Apple silicon and iOS,
# 27.2 and up). Bump the rev together with onicode's.
#
# `font-kit` is the Core Text text system on macOS. Without it gpui_macos
# falls back to GPUI's no-op text system, which shapes with made-up advances
# and rasterizes no glyph: every window, the headless test ones included,
# draws no text. gpui_platform enables nothing by default, so it is named here.
gpui = { git = "https://github.com/aislopware/gpui-fast", rev = "008ea9e423e2b6c7cb45be7e56992984b6fd7a0b", default-features = false }
gpui_platform = { git = "https://github.com/aislopware/gpui-fast", rev = "008ea9e423e2b6c7cb45be7e56992984b6fd7a0b", default-features = false, features = ["font-kit"] }
gpui_macros = { git = "https://github.com/aislopware/gpui-fast", rev = "008ea9e423e2b6c7cb45be7e56992984b6fd7a0b" }
reqwest_client = { git = "https://github.com/aislopware/gpui-fast", rev = "008ea9e423e2b6c7cb45be7e56992984b6fd7a0b" }
sum_tree = { git = "https://github.com/aislopware/gpui-fast", rev = "008ea9e423e2b6c7cb45be7e56992984b6fd7a0b" }

anyhow = "1"
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8.2.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "4.2.0"
schemars = "1"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
tracing = "0.1.41"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-kit/pull/2149
useless_conversion = "allow"

# Keep Cargo's default of 256 codegen units. Incremental builds re-codegen
# whole units, so with 16 units a one-line change in gpui-component or
# gpui-base took about 50% more CPU to rebuild.
[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

# These speed up the debug application at run time; opt-level 1 rendered the
# `text_view_scroll` bench frames 22-25% slower to save about 9% of a clean
# build's CPU, and nothing on an incremental one. Proc-macro crates are left
# out: they only run inside the compiler, and expanding gpui's macros takes as
# long unoptimized, so optimizing them only adds compile time.
[profile.dev.package]
resvg = { opt-level = 3 }
taffy = { opt-level = 3 }
smol = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui_apple = { opt-level = 3 }
gpui_macos = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
sum_tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
reqwest_client = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

# Stripping the symbol table costs no build time and shrinks a release binary
# by about a quarter.
[profile.release]
strip = "symbols"

[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

[workspace.metadata.typos.default.extend-identifiers]
consts = "consts"

[workspace.metadata.cargo-machete]
ignored = ["log", "anyhow", "serde"]
