[default]
# The v0.8.0 release notes credit two contributors whose GitHub handles the
# tokenizer reads as misspelled words; ignoring the exact handles keeps the
# rest of the file checked.
extend-ignore-re = [
    # Expected alphabetic list marker for ordinal 53.
    '\(53, "BA"\)',
    '\\u\{[0-9A-Fa-f]+\}',
    '@UncertaintyDeterminesYou4ndMe',
    '@alex-vas',
    # Valid Portuguese translations; keep English spellings checked elsewhere.
    'pt-BR: "Alteração atual"',
    'pt-BR: "Aceitar a atual"',
    'pt-BR: "Atual aceita"',
]

[default.extend-words]
# Official Lucide icon name for the astroid curve.
astroid = "astroid"
# Correct Italian singular of "command".
comando = "comando"
# Correct Portuguese word for "current" in localized UI labels.
atual = "atual"

[files]
extend-exclude = ["crates/story/src/fixtures/"]
