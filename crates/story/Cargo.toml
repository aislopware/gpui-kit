[package]
name = "gpui-component-story"
version = "0.9.0"
publish = false
edition.workspace = true

[features]
inspector = ["gpui-kit/inspector"]
tree-sitter = ["gpui-kit/tree-sitter-languages"]
test-support = ["gpui-kit/test-support"]
default = ["tree-sitter"]

# `gpui` is named only by the code GPUI's derives and `#[gpui_kit::test]` expand to
# (see its comment below), which cargo-machete does not read.
[package.metadata.cargo-machete]
ignored = ["gpui"]

[dependencies]
anyhow.workspace = true
# GPUI's derives and `#[gpui_kit::test]` expand to `gpui::` paths, so the crate
# names GPUI directly (the Kit's `gpui` re-export is that same crate).
gpui.workspace = true
gpui-kit = { workspace = true, features = ["speech"] }
gpui-fps.workspace = true
ls-types.workspace = true

async-channel = "2.3.1"
autocorrect = "2.14.2"
chrono = "0.4"
csv = "1.4"
fake = { version = "2.10.0", features = ["dummy"] }
itertools = "0.14.0"
rand = "0.8"
regex = "1"
serde = "1"
serde_json = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3.22", features = [
  "env-filter",
  "fmt",
  "registry",
], default-features = false }
unindent = "0.2.3"
dirs = "6.0.0"
reqwest_client.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
