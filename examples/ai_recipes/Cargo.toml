[package]
name = "gpui-kit-recipes"
description = "Tested consumer recipes published verbatim in the documentation."
version = "0.7.1"
publish = false
edition.workspace = true

# `gpui` is named only by the code GPUI's derives and `#[gpui_kit::test]` expand to
# (see its comment below), which cargo-machete does not read.
[package.metadata.cargo-machete]
ignored = ["gpui"]

[dependencies]
# GPUI's derives and `#[gpui_kit::test]` expand to `gpui::` paths. gpui-fast,
# unlike the published gpui-pre, does not rewrite them to the Kit, so the crate
# names GPUI directly (the Kit's `gpui` re-export is that same crate).
gpui.workspace = true
gpui-kit.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[features]
gpui-fast = ["gpui-kit/gpui-fast"]
