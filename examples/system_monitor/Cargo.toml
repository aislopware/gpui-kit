[package]
name = "system_monitor"
description = "A real-time system resource monitor using GPUI Component charts."
version = "0.9.0"
publish = false
edition = "2024"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
sysinfo = "0.37"
smol = "2"
battery = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
core-foundation = "0.10"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
